$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{status('Vollbild ist in diesem Browser nicht verfügbar.')}};
function unitHeight(u){return ch*u.cards.length+(u.cards.length===2?pg:0)}
function dimensions(){const w=board.clientWidth,phone=w<620;const cols=phone?3:Math.min(4,Math.floor(w/245));const gap=phone?(w<340?6:8):32;cw=Math.min(240,Math.floor((w-(cols+1)*gap)/cols));ch=phone?44:56;pg=phone?2:4;fs=phone?(w<340?11:12):Math.min(18,Math.max(13,Math.round(cw/12)));board.style.setProperty('--cw',cw+'px');board.style.setProperty('--ch',ch+'px');board.style.setProperty('--pg',pg+'px');board.style.setProperty('--fs',fs+'px');return {w,cols,gap,phone}}
function build(){units=shuffle(PAIRS.flatMap((p,k)=>p.map((text,side)=>({id:++uid,cards:[{text,k,side}],state:'',x:0,y:0,rot:Math.round((Math.random()*4-2)*10)/10,z:++zTop}))));render();arrange(true)}
function render(){if(drag)clearDrag();board.replaceChildren();units.forEach(u=>{const wrap=document.createElement('div');wrap.className='unit'+(u.cards.length===2?' pair':'')+(u.state==='good'?' good':u.state==='bad'?' bad':'');wrap.dataset.unit=u.id;u.el=wrap;u.cards.forEach(c=>{const b=document.createElement('button');b.className='card'+(c.side?' solution':'');b.textContent=c.text;b.setAttribute('aria-label',c.text+(u.cards.length===2?', verbunden mit '+u.cards.find(o=>o!==c).text:''));b.setAttribute('aria-pressed',selected===u?'true':'false');b.addEventListener('pointerdown',e=>startDrag(e,u));b.onclick=()=>{if(skipClick){skipClick=false;return}tap(u)};wrap.append(b)});if(u.cards.length===2){const split=document.createElement('button');split.className='split';split.textContent='';split.setAttribute('aria-label','Paar trennen: '+u.cards[0].text+' und '+u.cards[1].text);split.title='Paar trennen';split.disabled=u.state==='good';split.onclick=()=>separate(u);wrap.append(split)}board.append(wrap);place(u)});refreshSelection()}
function place(u){u.el.style.transform=`translate(${u.x}px,${u.y}px)`+(u.cards.length===1&&u.rot?` rotate(${u.rot}deg)`:'');u.el.style.height=unitHeight(u)+'px';u.el.style.zIndex=u.z||1}
function arrange(fresh){if(stage!==1)return;const {w,cols,gap,phone}=dimensions();const rows=Math.ceil(units.length/cols);const uh=Math.max(...units.map(unitHeight));const top=board.getBoundingClientRect().top+window.scrollY;const probe=document.createElement('div');probe.style.cssText='position:fixed;top:0;left:0;width:0;height:100svh;visibility:hidden;pointer-events:none';document.body.append(probe);const svh=Math.min(window.innerHeight,probe.offsetHeight||window.innerHeight);probe.remove();const H=Math.max(360,svh-top);const chk=$('check').getBoundingClientRect();const band=Math.max(phone?80:96,Math.round(window.innerHeight-chk.top)+10);const usable=H-band-12;const vgap=Math.max(phone?14:24,Math.floor((usable-rows*uh)/Math.max(1,rows)));const pitch=uh+vgap;const total=rows*pitch-vgap;board.style.height=Math.max(H,total+band+12)+'px';const offset=12+Math.max(0,Math.floor((usable-total)/2));const used=cols*cw+(cols-1)*gap;const left=Math.max(0,Math.floor((w-used)/2));const jy=Math.max(0,Math.min(8,Math.floor((vgap-6)/2)));units.forEach((u,i)=>{const c=i%cols,r=Math.floor(i/cols);if(fresh){u.jx=Math.round(Math.random()*6-3);u.jy=Math.round(Math.random()*2*jy-jy)}u.x=Math.max(0,Math.min(w-cw,left+c*(cw+gap)+(u.jx||0)));u.y=Math.max(12,offset+r*pitch+(u.jy||0));place(u)})}
function freeSpot(u,others){const w=board.clientWidth,h=board.clientHeight,uh=unitHeight(u);const fits=(x,y)=>x>=0&&y>=12&&x+cw<=w&&y+uh<=h&&!others.some(o=>overlap(u,o,x,y));if(fits(u.x,u.y))return [u.x,u.y];let best=null,bd=Infinity;for(let y=12;y+uh<=h;y+=10)for(let x=0;x+cw<=w;x+=10){const d=Math.hypot(x-u.x,y-u.y);if(d<bd&&fits(x,y)){bd=d;best=[x,y]}}if(best)return best;board.style.height=(h+uh+12)+'px';return [u.x,h]}
function covered(u,f){const x=Math.max(0,Math.min(u.x+cw,f.x+cw)-Math.max(u.x,f.x)),y=Math.max(0,Math.min(u.y+unitHeight(u),f.y+unitHeight(f))-Math.max(u.y,f.y));return x*y/(cw*unitHeight(u))}
function settle(fixed){const others=units.filter(u=>u!==fixed);for(const u of others){if(covered(u,fixed)<.6)continue;const rest=units.filter(o=>o!==u);const [x,y]=freeSpot(u,rest);u.x=x;u.y=y;place(u)}}
function refreshSelection(){units.forEach(u=>{u.el.classList.toggle('selected',selected===u);u.el.querySelectorAll('.card').forEach(b=>b.setAttribute('aria-pressed',String(selected===u)))})}
function tap(u){if(u.cards.length===2){status(u.state==='good'?'Dieses Paar ist richtig.':'Zum Trennen auf den Streifen zwischen den Karten tippen.');return}if(selected&&selected!==u){join(selected,u);selected=null}else selected=selected===u?null:u;refreshSelection()}
function join(a,b){if(a===b||a.cards.length!==1||b.cards.length!==1)return;const next={id:++uid,cards:[...b.cards,...a.cards],state:'',x:b.x,y:b.y,z:++zTop};if(b.y+ch*2+pg+12>board.clientHeight)board.style.height=(b.y+ch*2+pg+12)+'px';const i=units.indexOf(b);units=units.filter(u=>u!==a&&u!==b);units.splice(Math.min(i,units.length),0,next);selected=null;joining=false;render();status('Paar verbunden. Mit dem blauen Haken prüfen.');next.el.querySelector('.card').focus({preventScroll:true})}
function separate(u){if(u.state==='good')return;const i=units.indexOf(u);units.splice(i,1,...u.cards.map((c,j)=>({id:++uid,cards:[c],state:'',x:u.x,y:u.y+j*(ch+pg),rot:0,z:++zTop})));selected=null;render();status('Paar getrennt. Ordnen Sie die Karten neu zu.')}
function overlap(a,b,x=a.x,y=a.y){return x<b.x+cw&&x+cw>b.x&&y<b.y+unitHeight(b)&&y+unitHeight(a)>b.y}
function startDrag(e,u){if(e.button!==0||drag||joining)return;skipClick=false;const el=e.currentTarget;el.setPointerCapture(e.pointerId);u.z=++zTop;place(u);drag={u,el,startX:e.clientX,startY:e.clientY,ox:u.x,oy:u.y,moved:false,target:null};el.onpointermove=moveDrag;el.onpointerup=finishDrag;el.onpointercancel=cancelDrag}
function moveDrag(e){if(!drag)return;const d=drag,dx=e.clientX-d.startX,dy=e.clientY-d.startY;if(!d.moved&&Math.hypot(dx,dy)<7)return;d.moved=true;d.u.el.classList.add('dragging');d.u.x=Math.max(0,Math.min(board.clientWidth-cw,d.ox+dx));d.u.y=Math.max(12,Math.min(board.clientHeight-unitHeight(d.u),d.oy+dy));place(d.u);d.target=null;if(d.u.cards.length===1){let distance=Infinity;for(const u of units){if(u===d.u||u.cards.length!==1)continue;const dist=Math.hypot(u.x-d.u.x,u.y-d.u.y);if(Math.abs(u.x-d.u.x)<cw*.68&&Math.abs(u.y-d.u.y)<ch*.8&&dist<distance){d.target=u;distance=dist}}}units.forEach(u=>u.el.classList.toggle('target',u===d.target))}
function clearDrag(){if(!drag)return;drag.el.onpointermove=drag.el.onpointerup=drag.el.onpointercancel=null;units.forEach(u=>u.el.classList.remove('dragging','target'));drag=null}
function finishDrag(){if(!drag)return;const d=drag;clearDrag();skipClick=d.moved;if(d.moved){selected=null;if(d.target){const t=d.target,u=d.u;joining=true;u.x=t.x;u.y=t.y+ch+pg;u.rot=0;u.el.style.pointerEvents='none';t.el.style.pointerEvents='none';place(u);setTimeout(()=>{joining=false;if(units.includes(u)&&units.includes(t)&&u.cards.length===1&&t.cards.length===1)join(u,t)},170)}else{const u=d.u,under=units.filter(o=>o!==u&&o.cards.length===1&&covered(o,u)>=.5);if(under.length){u.z=Math.max(1,Math.min(...under.map(o=>o.z||1))-1);place(u)}}refreshSelection();setTimeout(()=>skipClick=false,0)}}
function cancelDrag(){finishDrag()}
function complete(n){completed[n]=true;unlocked=Math.max(unlocked,Math.min(3,n+1));updateTiles();showDialog('Richtig!',n===1?'Sie haben alle '+(NUMBERS[PAIRS.length]||PAIRS.length)+' Paare richtig zugeordnet.':n===2?'Alle Zahlen stimmen.':'Sie haben alle drei Stufen geschafft!',()=>go(n+1,n<3),n<3?'Weiter zu Stufe '+(n+1):'Abschließen')}
function checkPairs(){let good=0,bad=0;for(const u of units){if(u.cards.length!==2)continue;const a=u.cards[0],b=u.cards[1];u.state=a.k===b.k&&a.side!==b.side?'good':'bad';if(u.state==='good')good++;else bad++}render();if(good===PAIRS.length){status(PAIRS.length+' von '+PAIRS.length+' Paaren richtig.');complete(1)}else status(good+' von '+PAIRS.length+' Paaren richtig.'+(bad?' Rote Paare trennen und neu zuordnen.':' Ordnen Sie die übrigen Karten zu.'))}
function norm(s){return String(s??'').replace(/[−–﹣－]/g,'-').replace(/\s+/g,'').replace(',','.').replace(/^\+(?=\d)/,'')}
function gradeValues(values,answers){const remaining=answers.map(norm);return values.map(v=>{v=norm(v);if(!v)return null;const i=remaining.indexOf(v);if(i<0)return false;remaining.splice(i,1);return true})}
function checkFields(root){const fields=[...root.querySelectorAll('select,input')];let ok=0,empty=0;const sets={};const paint=(f,result)=>{f.classList.remove('ok','bad');f.removeAttribute('aria-invalid');if(result===null){empty++;return}f.classList.add(result?'ok':'bad');f.setAttribute('aria-invalid',String(!result));if(result)ok++};fields.forEach(f=>{if(f.dataset.set)(sets[f.dataset.set]??=[]).push(f);else paint(f,!norm(f.value)?null:norm(f.value)===norm(f.dataset.a))});Object.values(sets).forEach(g=>{const results=gradeValues(g.map(f=>f.value),g.map(f=>f.dataset.a));g.forEach((f,i)=>paint(f,results[i]))});return {ok,empty,total:fields.length}}
function checkText(){const result=checkFields($('t'+stage));if(result.ok===result.total)complete(stage);else status(result.ok+' von '+result.total+' richtig.'+(result.empty?' Noch '+result.empty+(result.empty===1?' Feld':' Felder')+' leer.':' Rote Felder verbessern.'))}
$('check').onclick=()=>stage===1?checkPairs():checkText();
document.querySelectorAll('input,select').forEach((f,i)=>{f.setAttribute('aria-label',(f.closest('#t2')?'Stufe 2':'Stufe 3')+', Eingabe '+(i+1));if(f.tagName==='INPUT'){f.autocomplete='off';f.spellcheck=false;f.inputMode='text'}f.addEventListener('input',()=>{f.classList.remove('ok','bad');f.removeAttribute('aria-invalid');status('')})});
function restart(){units=[];unlocked=1;completed=[false,false,false,false];document.querySelectorAll('input,select').forEach(f=>{f.value='';f.classList.remove('ok','bad');f.removeAttribute('aria-invalid')});go(0)}
$('restart').onclick=restart;
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(window.innerWidth!==lastW){lastW=window.innerWidth;if(stage===1)arrange()}},120)});
go(0);
</script>
</body>
